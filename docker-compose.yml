# KidsUp production-like stack: nginx (front) -> API (back) -> PostgreSQL (db).
# Only the front is reachable from outside, and only on the loopback address by default.
#
#   cp .env.example .env     # then set the four passwords
#   docker compose up --build
#   open http://localhost:8080
#
# Startup order: db -> bootstrap (accounts, migrations, grants; exits) -> back -> front. retention runs beside them.
# Networks: `edge` (nginx only, the one with a route out), `app` (nginx <-> API, internal) and `data`
# (API, jobs and database, internal). The API therefore cannot reach the internet and the database cannot be reached
# from anywhere but the API and the jobs.

name: kidsup

x-logging: &default-logging
  # Log files are capped by size (three files of 10 MB per container), not by age: how long a line survives depends on
  # the traffic. Nothing in them is personal data (SEC-B-10), which is what makes that acceptable.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging: *default-logging

services:
  db:
    <<: *hardening
    build: ./db
    image: kidsup-db
    restart: unless-stopped
    # Not root: the data directory is owned by uid 70, so the image's root-only ownership fix is not needed.
    user: "70:70"
    # The server's own log must never hold a visitor's details: a constraint error would print the whole failing row
    # (DETAIL), a failing or slow statement is logged with its text and bound values. Errors still say what went wrong.
    # A managed PostgreSQL needs the same settings (docs/docker.md).
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    environment:
      # The superuser. Only the bootstrap job and the operator use it; the API never does (SEC-B-07).
      POSTGRES_USER: kidsup
      POSTGRES_DB: kidsup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs: [/tmp, /var/run/postgresql]
    pids_limit: 300
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidsup -d kidsup"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  # One-off: creates/updates the owner, app and retention accounts, runs the migrations as the owner and grants the other
  # two exactly what they need (the API: INSERT; retention: find, delete, mark enrolled). Safe to run on every start,
  # and it upgrades a database created before the split.
  bootstrap:
    <<: *hardening
    image: kidsup-back
    pull_policy: never
    command: ["python", "-m", "app.bootstrap"]
    restart: "no"
    healthcheck:
      disable: true # the image's check asks the API, which is not running here
    environment:
      KIDSUP_ADMIN_DATABASE_URL: postgresql://kidsup:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/kidsup
      KIDSUP_MIGRATION_DATABASE_URL: postgresql://kidsup_owner:${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env}@db:5432/kidsup
      KIDSUP_DATABASE_URL: postgresql://kidsup_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@db:5432/kidsup
      KIDSUP_RETENTION_DATABASE_URL: postgresql://kidsup_retention:${POSTGRES_RETENTION_PASSWORD:?Set POSTGRES_RETENTION_PASSWORD in .env}@db:5432/kidsup
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

  back:
    <<: *hardening
    build: ./back
    image: kidsup-back
    restart: unless-stopped
    environment:
      KIDSUP_ENVIRONMENT: production
      # The API's account can add an application and nothing else: it cannot read one back, change or delete one. It
      # never gets the owner, superuser or retention passwords, and it refuses to start as anything wider (SEC-B-07).
      KIDSUP_DATABASE_URL: postgresql://kidsup_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@db:5432/kidsup
      # Requests arrive from nginx without the browser's Host header, so the API's own name is what must be allowed.
      KIDSUP_ALLOWED_HOSTS: '["back","localhost","127.0.0.1"]'
      # The browser only talks to nginx (same origin), so no cross-origin access is granted at all.
      KIDSUP_CORS_ORIGINS: "[]"
      # X-Forwarded-For is believed only from this range: the private nginx <-> API network, which holds nginx and
      # nothing else. Never "*" (uvicorn then trusts any peer and the left-most, client-supplied, address).
      FORWARDED_ALLOW_IPS: ${APP_SUBNET:-172.29.250.0/28}
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    networks: [data, app]

  # Deletes applications that never led to enrolment once they are older than RETENTION_DAYS (SEC-B-09), once a day.
  # It also hosts the operator's commands, because only its account may delete or read what they match on:
  #   docker compose exec retention python -m app.cli --help
  # A failing run ends the container (and Docker then restarts it), so a broken deletion job shows up as a restarting
  # container instead of running for months without deleting anything.
  retention:
    <<: *hardening
    image: kidsup-back
    pull_policy: never
    init: true
    command: ["sh", "-c", "while true; do python -m app.cli purge-expired || exit 1; sleep 86400; done"]
    restart: unless-stopped
    healthcheck:
      disable: true # the image's check asks the API, which is not running here
    environment:
      KIDSUP_ENVIRONMENT: production
      KIDSUP_DATABASE_URL: postgresql://kidsup_retention:${POSTGRES_RETENTION_PASSWORD:?Set POSTGRES_RETENTION_PASSWORD in .env}@db:5432/kidsup
      KIDSUP_RETENTION_DAYS: ${RETENTION_DAYS:-365}
    mem_limit: 256m
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [data]

  front:
    <<: *hardening
    build: ./front
    restart: unless-stopped
    ports:
      # Loopback by default. Put a TLS-terminating proxy in front for real traffic (see docs/docker.md).
      - "${FRONT_BIND:-127.0.0.1}:${FRONT_PORT:-8080}:8080"
    mem_limit: 128m
    depends_on:
      back:
        condition: service_healthy
    networks: [edge, app]

networks:
  # The only network with a route to the outside; only nginx joins it.
  edge: {}
  # nginx <-> API. Internal (no route out) with a fixed range, so uvicorn can trust exactly this range.
  app:
    internal: true
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.29.250.0/28}
  # API, jobs <-> database. Internal.
  data:
    internal: true

volumes:
  db-data:
