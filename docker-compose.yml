# KidsUp production-like stack: nginx (front) -> API (back) -> PostgreSQL (db).
# Only the front is reachable from outside; the API and the database have no published ports.
#
#   cp .env.example .env     # then set POSTGRES_PASSWORD
#   docker compose up --build
#   open http://localhost:8080

name: kidsup

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kidsup
      POSTGRES_DB: kidsup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidsup -d kidsup"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  back:
    build: ./back
    restart: unless-stopped
    environment:
      KIDSUP_ENVIRONMENT: production
      KIDSUP_DATABASE_URL: postgresql://kidsup:${POSTGRES_PASSWORD}@db:5432/kidsup
      # Requests arrive from nginx without the browser's Host header, so the API's own name is what must be allowed.
      KIDSUP_ALLOWED_HOSTS: '["back","localhost","127.0.0.1"]'
      # The browser only talks to nginx (same origin), so no cross-origin access is granted at all.
      KIDSUP_CORS_ORIGINS: "[]"
      # Only nginx can reach this container (no published port), so its X-Forwarded-For is trusted.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend, frontend]

  front:
    build: ./front
    restart: unless-stopped
    ports:
      # Loopback by default. Put a TLS-terminating proxy in front for real traffic (see docs/docker.md).
      - "${FRONT_BIND:-127.0.0.1}:${FRONT_PORT:-8080}:8080"
    depends_on:
      back:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [frontend]

networks:
  # db <-> back only; internal means no route to the outside world.
  backend:
    internal: true
  frontend:

volumes:
  db-data:
