# Who may reach the admin origin at all (admin/docs/README.md, rule 7: "network-restricted where possible").
# Included inside `server {}`. Empty by default, which means every address that can reach the published port is let in
# (by default that is this machine only: ADMIN_BIND=127.0.0.1 in .env).
#
# Before the panel is reachable from anywhere else, list the VPN or office addresses of the staff and refuse the rest;
# put these lines here (CIDR ranges, one `allow` each, then `deny all`). Keep the first one: it is the container's own
# health check, which Docker would otherwise see refused and mark the container unhealthy.
#
#   allow 127.0.0.1;
#   allow 198.51.100.0/24;
#   deny all;
#
# Behind a TLS proxy, fill in real-ip.conf as well, or the address checked here is the proxy's and the list is useless.
# Every location in default.conf inherits this: the screens, the sign-in and the API alike.
