# The real address of a staff member behind a TLS-terminating reverse proxy (SEC-B-08, SEC-B-10). Included inside `server {}`.
#
# Without a proxy in front, nginx sees the visitor's own address and nothing is needed here. Behind a proxy it sees
# the proxy's address for everybody, so the per-address rate limit would treat all staff as one, the audit log would
# record the proxy's network instead of theirs, and the allow-list in network-allow-list.conf would let the proxy
# through for everybody. When the proxy is chosen, uncomment the three lines and list ONLY the address range of that
# proxy in the first one:
#
#   set_real_ip_from 203.0.113.0/24;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
#
# Whatever range is listed decides which address the rate limit, the allow-list, the log and the API's audit trail see,
# so never widen it to "everybody".
