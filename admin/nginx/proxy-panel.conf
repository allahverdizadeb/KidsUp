# Shared by every location that passes a request on to the panel API (included inside the location).
#
# The API sets its own copies of the security headers. Drop them and send the shared set instead, so that nothing is
# duplicated (a repeated X-Frame-Options is ignored by browsers) and nginx's own 413/429/502 answers carry exactly the
# same headers as everything else. The API cannot ask nginx to serve other files or change its behaviour through
# X-Accel-* either.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header X-Robots-Tag;
proxy_hide_header Cache-Control;
proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
include /etc/nginx/snippets/security-headers.conf;
include /etc/nginx/snippets/csp-api.conf;

set $panel_upstream http://panel:8000;
proxy_pass $panel_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Overwrite (never append to) X-Forwarded-For so a client cannot spoof its address: the API records the network it
# comes from in the audit log, and rate-limits sign-in by it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
# An export of many applications takes a while to build.
proxy_read_timeout 60s;
