# CSP of the screens and their files: everything (scripts, styles, fonts, images) only from our own origin, with no
# exceptions and no third-party resource at all (admin/docs/README.md, rule 7). Same policy as the public site's.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
