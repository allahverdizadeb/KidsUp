# Included by the image's nginx.conf inside http {}.
# The admin panel's origin (admin/docs/README.md, rules 1, 3 and 7): nothing here is public, nothing is cached, nothing is
# indexed and no third-party resource is ever allowed. nginx serves the screens and passes /api/admin/ on to the panel API;
# who may do what is decided by the API, never here.

# A coarse limit in front of Python. The API enforces finer ones of its own (per address, and a lock-out per account).
limit_req_zone $binary_remote_addr zone=admin_signin:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=1200r/m;
# How many requests one address may have open at once (limit_req counts them when they start): a body sent slowly or
# a reply read slowly holds a connection. Needs the real client address (real-ip.conf) once a proxy sits in front.
limit_conn_zone $binary_remote_addr zone=conn_per_address:10m;

# Access log without staff addresses or anything typed into a request: the address is cut to its network (IPv4: last
# octet zeroed; IPv6: only the first three groups kept) and the path is logged without its query string. Docker rotates
# the log by size (see docker-compose.yml), so old lines are overwritten.
map $remote_addr $anonymised_address {
    ~^(?<network>\d+\.\d+\.\d+)\.\d+$                           $network.0;
    ~^(?<network>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):       $network::;
    default                                                     0.0.0.0;
}
log_format privacy '$anonymised_address [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log privacy;
    # nginx's error log always writes "client: <full address>" and the whole request line, and its format cannot be
    # changed. So only critical failures go there; a refused or failed request still shows up in the anonymised access
    # log as a 403/413/429/502/504, and a panel that is down as an unhealthy container.
    error_log /var/log/nginx/error.log crit;

    # Who may reach this origin at all, and the real address behind a TLS-terminating reverse proxy. Both empty until
    # an operator fills them in (see the files).
    include /etc/nginx/snippets/network-allow-list.conf;
    include /etc/nginx/snippets/real-ip.conf;

    # The answers nginx gives before it has chosen a location (400, 414, 431 ...) carry the headers too. Every location
    # below sets its own, and add_header is only inherited by a level that sets none, so nothing is ever sent twice.
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-page.conf;

    # Everything staff send is a small JSON document (the API caps it at 64 KiB too); only a picture is larger (below).
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 20s;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    limit_conn conn_per_address 30;
    limit_conn_status 429;

    # Docker's own name server. The panel is looked up by name for every request (see `set $panel_upstream`), so a
    # recreated container with a new address is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Never serve dotfiles.
    location ~ /\.(?!well-known) {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        deny all;
    }

    # Sign in: the one request that needs no session. Tighter limit than the rest.
    location = /api/admin/sessions {
        # Anything but POST is answered before the rate limiter, so a refused request does not use up the budget.
        if ($request_method != POST) {
            return 405;
        }
        limit_req zone=admin_signin burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-panel.conf;
    }

    # The picture upload: the one request with a large body. nginx keeps the body in its temporary folder (a small
    # tmpfs, see docker-compose.yml) before passing it on, so the size is exactly what the API takes (5 MiB) and an
    # address may have only a couple open at once.
    location = /api/admin/media {
        client_max_body_size 5m;
        limit_conn conn_per_address 2;
        limit_req zone=admin_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-panel.conf;
    }

    # The rest of the panel's API. Authentication and authorisation are the API's (default deny).
    location /api/admin/ {
        limit_req zone=admin_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-panel.conf;
    }

    # Anything else under /api/ is answered here and never reaches the panel.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api.conf;
        return 404;
    }

    # The pictures staff uploaded, from the `content` volume (mounted read-only), so the page editor can show them. The
    # same files the public site serves under the same address; nothing else of the volume is reachable from here.
    # A picture is named by a random id that is never used for another one. Not cached (security-headers.conf).
    location ~ "^/media/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.webp$" {
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        root /usr/share/nginx/content;
        # The volume is written by the panel: a link planted in it must not lead out of it.
        disable_symlinks on from=$document_root;
        try_files $uri =404;
    }

    # Anything else under /media/ is not a file: no listing, and never the screens standing in for a file.
    location /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        return 404;
    }

    # The screens. Nothing here is cached (security-headers.conf says so for every answer).
    location / {
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        try_files $uri $uri/ /index.html;
    }
}
