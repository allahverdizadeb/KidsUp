[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# The database URL comes from alembic/env.py: the one `app.bootstrap` hands in (the schema owner's), else
# KIDSUP_MIGRATION_DATABASE_URL, else KIDSUP_DATABASE_URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
