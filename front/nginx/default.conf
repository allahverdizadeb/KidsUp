# Included by the image's nginx.conf inside http {}.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# Access log without visitors' addresses (an IP is personal data, and this is a site about children): the address is
# cut to its network (IPv4: last octet zeroed; IPv6: only the first three groups kept) and the path is logged without
# its query string. Docker rotates the log by size (see docker-compose.yml), so old lines are overwritten.
map $remote_addr $anonymised_address {
    ~^(?<network>\d+\.\d+\.\d+)\.\d+$                           $network.0;
    ~^(?<network>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):       $network::;
    default                                                     0.0.0.0;
}
log_format privacy '$anonymised_address [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log privacy;
    # nginx's error log always writes "client: <full address>" and the whole request line, and its format cannot be
    # changed. So only critical failures go there; an upstream that is down or a refused request still shows up in the
    # anonymised access log as a 502/504/413/429, and as an unhealthy container.
    error_log /var/log/nginx/error.log crit;

    # Only when a reverse proxy sits in front; empty until then (see the file).
    include /etc/nginx/snippets/real-ip.conf;

    # The answers nginx gives before it has chosen a location (400, 414, 431 ...) carry the headers too. Every location
    # below sets its own, and add_header is only inherited by a level that sets none, so nothing is ever sent twice.
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-page.conf;

    # The only request body ever sent is the ~1 KiB application form.
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    # Docker's own name server. The API is looked up by name for every request (see `set $api_upstream`), so a
    # recreated API container with a new address is found again; nginx would otherwise keep the one it saw at start-up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Never serve dotfiles.
    location ~ /\.(?!well-known) {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        deny all;
    }

    # The one endpoint of the API the page uses, and only for POST. The API container is not published; this is the
    # only way in, so anything else it offers (/health, the interactive docs outside production) stays out of reach.
    location = /api/applications {
        limit_except POST {
            deny all;
        }
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        # The API sets its own copies of these headers. Drop them and send the shared set instead, so that nothing is
        # duplicated (a repeated X-Frame-Options is ignored by browsers) and nginx's own 413/429/502 answers carry
        # exactly the same headers as everything else. The API cannot ask nginx to serve other files or change its
        # behaviour through X-Accel-* either.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api.conf;

        set $api_upstream http://back:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Overwrite (never append to) X-Forwarded-For so a client cannot spoof its address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Everything else under /api/ is answered here and never reaches the API.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api.conf;
        return 404;
    }

    # Fingerprinted build output never changes: cache for a year.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2)$" {
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The brochure is a download, never a page of this origin: browsers save it instead of displaying it.
    location ~* "^/assets/.+\.pdf$" {
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # Other static files (images) keep their names: cache for a day.
    location /assets/ {
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
