# Included by the image's nginx.conf inside http {}.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The only request body ever sent is the ~1 KiB application form.
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    # Never serve dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Backend API. The API container is not published; this is the only way in.
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://back:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Overwrite (never append to) X-Forwarded-For so a client cannot spoof its address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Fingerprinted build output never changes: cache for a year.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other static files (images) keep their names: cache for a day.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
