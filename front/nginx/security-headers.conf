# Response headers for every answer nginx gives, together with exactly one of the two Content-Security-Policy snippets
# (csp-page.conf for the page and its files, csp-api.conf for the API's JSON). nginx drops inherited add_header
# directives as soon as a location defines its own, so this file is included explicitly in every location, and once at
# server level for the answers nginx gives before it has chosen a location (400, 414, 431 ...).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
