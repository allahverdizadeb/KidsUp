# Included in every location that serves the SPA. (nginx drops inherited add_header directives as soon as a
# location defines its own, so this file is included explicitly rather than set once at server level.)
#
# CSP: everything (scripts, styles, fonts, images) only from our own origin, with no exceptions. React sets styles
# through the CSSOM, which CSP does not restrict, so no 'unsafe-inline' is needed. The founder's Wharton credential
# image is self-hosted: hot-linking it needed an img-src exception, and the issuer's redirect to a second host broke it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
