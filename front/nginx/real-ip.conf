# The real visitor address behind a TLS-terminating reverse proxy (SEC-F-11, SEC-B-08). Included inside `server {}`.
#
# Without a proxy in front, nginx sees the visitor's own address and nothing is needed here. Behind a proxy it sees
# the proxy's address for everybody, so the per-address rate limit would treat all visitors as one. When the proxy is
# chosen, uncomment the three lines and list ONLY the address range of that proxy in the first one:
#
#   set_real_ip_from 203.0.113.0/24;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
#
# Whatever range is listed decides which address the rate limit and the log see, so never widen it to "everybody".
