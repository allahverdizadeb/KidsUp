# CSP of the page and its files: everything (scripts, styles, fonts, images) only from our own origin, with no
# exceptions. React sets styles through the CSSOM, which CSP does not restrict, so no 'unsafe-inline' is needed. The
# founder's Wharton credential image is self-hosted: hot-linking it needed an img-src exception, and the issuer's
# redirect to a second host broke it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
